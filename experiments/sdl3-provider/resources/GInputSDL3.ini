[SDL3]
; Restart the game after changing this setting.
; 0 = TwinStick/MISI owns all game input; vibration is controlled separately.
; 1 = load GInputSDL3Hooks.dll: GInput owns classic game input (disable TwinStick).
EnableGameInputHooks=0

; Observe game events and send rumble through SDL3, including native DualSense.
; Requires the matching GInputSDL3Hooks.dll even when input hooks are disabled.
; Disable/remove the old XInput-only vibration ASI when using this feature.
EnableGameVibration=1

; Matches MISI's per-axis deadzone without rescaling stick magnitude.
DeadZonePercent=20
TriggerThresholdPercent=25
AllowBackgroundInput=0
